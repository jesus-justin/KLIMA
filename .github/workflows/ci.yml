name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          npm ci || true
      - name: Build assets
        run: |
          npm run build || true
      - name: Lint PHP (basic)
        run: |
          php -v || true
          echo "No PHP linter configured; consider adding phpstan or psalm"
